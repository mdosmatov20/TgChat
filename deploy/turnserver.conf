# /etc/turnserver.conf — TURN-сервер coturn
listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=ТОТ_ЖЕ_СЕКРЕТ_ЧТО_В_TURN_SECRET
realm=example.uz
total-quota=100
min-port=49152
max-port=65535
no-cli
no-multicast-peers
# не даём использовать TURN для доступа к внутренним сетям сервера
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# если сервер за NAT у облачного провайдера (внутренний IP != публичный), раскомментируйте:
# external-ip=ПУБЛИЧНЫЙ_IP_СЕРВЕРА
